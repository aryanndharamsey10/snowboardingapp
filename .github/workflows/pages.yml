name: Deploy frontend to GitHub Pages

on:
  push:
    branches: [main]
    paths: ['static/**', 'tests/frontend.test.mjs', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - run: node --check static/app.js && node --test tests/frontend.test.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: static
      - name: Deploy frontend
        id: deployment
        uses: actions/deploy-pages@v4
